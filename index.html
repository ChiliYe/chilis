<!-- @format -->

<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<meta name="description" content="椒游门户网站" />
		<title>椒游 · Chilis</title>
	</head>
	<body>
		<main class="shell">
			<nav class="topbar" aria-label="主导航">
				<a
					class="brand"
					href="/"
					aria-label="椒游首页"
				>
					<span class="brand-mark">C</span>
					<span>椒游</span>
				</a>
				<span class="status"
					><span class="status-dot"></span
					>正在营业</span
				>
			</nav>

			<section class="hero">
				<p class="eyebrow">CHILIS · SINCE 2026</p>
				<h1>一口热烈，<br /><em>恰到好处。</em></h1>
				<p class="intro">
					从一颗辣椒开始，探索城市里那些让人记住的味道。
				</p>
				<a class="action" href="#explore"
					>开始探索
					<span aria-hidden="true">↗</span></a
				>
			</section>

			<section
				class="feature"
				id="explore"
				aria-label="今日推荐"
			>
				<div>
					<p class="eyebrow">TODAY'S PICK</p>
					<h2>风味，正在发生。</h2>
				</div>
				<p class="feature-note">
					这里将成为你的内容入口。<br />现在，先让网站顺利上线。
				</p>
			</section>
		</main>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
